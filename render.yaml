services:
  - type: web
    name: west-food-restaurant
    runtime: docker
    plan: free
    dockerfilePath: ./dockerfile
    dockerContext: .
    healthCheckPath: /data/dishData.json
    envVars:
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MENU_DATA_DIR
        value: /app/storage
      - key: MENU_SEED_DIR
        value: /app/seed
      - key: GOOGLE_CALLBACK_URL
        value: https://west-food-restaurant.onrender.com/api/auth-callback
      - key: FRONTEND_URL
        value: https://west-food-restaurant.onrender.com